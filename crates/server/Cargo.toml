[package]
name = "infero-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "infero_server"
path = "src/lib.rs"

[[bin]]
name = "infero"
path = "src/main.rs"

[dependencies]
infero-model.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio-stream = "0.1.19"
clap = { version = "4.6.6", features = ["derive"] }
futures = "0.3.34"
tower-http = { version = "0.7.0", features = ["cors", "trace"] }
infero-gguf.workspace = true
infero-gpu.workspace = true
infero-tokenizer.workspace = true
tokio = { version = "1.53.1", features = ["full"] }
axum = { version = "0.8.9", features = ["macros"] }
# Decoding a `data:` image URL: base64 for the envelope, `image` for the
# pixels. Only the formats OpenAI's own API accepts, to keep the parsing
# surface this exposes to request bodies as small as it can be.
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
# Video decode goes through `ffmpeg`/`ffprobe` subprocesses (see
# `src/video.rs`'s module note for why, over a codec crate), and they need a
# real seekable file rather than a pipe. `tempfile` rather than a hand-built
# path in `/tmp`: this box is shared with other users, and a predictable temp
# filename there is a symlink-attack vector.
tempfile = "3"

[dev-dependencies]
http-body-util = "0.1.4"
hyper = { version = "1.11.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
infero-model.workspace = true

[features]
default = ["cuda-13"]
cuda-13 = ["infero-model/cuda-13", "infero-gpu/cuda-13"]
cuda-12 = ["infero-model/cuda-12", "infero-gpu/cuda-12"]
metal = ["infero-model/metal", "infero-gpu/metal"]
nccl = ["infero-model/nccl"]

[package]
name = "infero-kernels"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
infero-safetensors.workspace = true
infero-cuda = { workspace = true, optional = true }
infero-gpu.workspace = true
infero-gguf.workspace = true
anyhow.workspace = true
half.workspace = true
tracing.workspace = true
cudarc = { version = "0.19", default-features = false, optional = true, features = ["std", "driver", "nvrtc", "cublas", "f16", "dynamic-loading"] }

[dev-dependencies]
# A dev-dependency on the crate above this one, so that the partial-rope kernel
# tests can check against `infero_model::qwen35`'s host reference rather than a
# second copy of it that would drift. Cargo permits the cycle because it only
# exists for test targets; the library itself still depends on nothing upward.
infero-model.workspace = true
tracing-subscriber.workspace = true
rand = "0.9"
cudarc = { version = "0.19", default-features = false, features = ["std", "driver", "nvrtc", "cublas", "f16", "dynamic-loading"] }

[features]
default = ["cuda-13"]
cuda = ["dep:infero-cuda", "dep:cudarc", "infero-gpu/cuda"]
cuda-13 = ["cuda", "infero-cuda/cuda-13", "cudarc/cuda-13010", "infero-gpu/cuda-13"]
cuda-12 = ["cuda", "infero-cuda/cuda-12", "cudarc/cuda-12080", "infero-gpu/cuda-12"]
metal = ["infero-gpu/metal"]
# AOT-compiles crates/kernels/src/cutlass/fp8_bw_gemm.cu with nvcc and links
# it in -- needs a full CUDA Toolkit (INFERO_NVCC) and an NVIDIA/cutlass
# checkout (INFERO_CUTLASS_DIR); see build.rs. Off by default: every other
# kernel needs neither.
cutlass = ["cuda"]
# AOT-compiles crates/kernels/src/cu_vendor/flash_attn2_shim.cu with nvcc and
# links it in -- needs a full CUDA Toolkit (INFERO_NVCC), an NVIDIA/cutlass
# checkout (INFERO_CUTLASS_DIR, same one the `cutlass` feature uses -- FA2's
# own kernel_traits.h is itself built on CUTLASS's CuTe), and a
# Dao-AILab/flash-attention checkout (INFERO_FLASH_ATTN_DIR); see build.rs.
# Provides a second, vendor-sourced `AttentionBackend` alongside this crate's
# own tuned kernels -- see `attn_backend.rs` and the design doc at
# docs/superpowers/specs/2026-09-05-pluggable-attention-backend-design.md.
flash_attn2 = ["cuda"]
# Links NCCL (`libnccl.so`, a prebuilt vendor shared library -- no AOT
# compile step of our own, unlike `cutlass`/`flash_attn2`) for cross-GPU
# tensor-parallel communication. Needs INFERO_NCCL_DIR pointing at an install
# with `include/nccl.h` and `lib/libnccl.so` (e.g. `/usr` after
# `apt install libnccl2 libnccl-dev`); see build.rs.
nccl = ["cuda"]

[[example]]
name = "cutlass_vs_block"
required-features = ["cutlass"]

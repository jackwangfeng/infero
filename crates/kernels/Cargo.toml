[package]
name = "infero-kernels"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
infero-safetensors.workspace = true
infero-cuda = { workspace = true, optional = true }
infero-gpu.workspace = true
infero-gguf.workspace = true
anyhow.workspace = true
half.workspace = true
tracing.workspace = true
cudarc = { version = "0.19", default-features = false, optional = true, features = ["std", "driver", "nvrtc", "cublas", "f16", "dynamic-loading"] }

[dev-dependencies]
# A dev-dependency on the crate above this one, so that the partial-rope kernel
# tests can check against `infero_model::qwen35`'s host reference rather than a
# second copy of it that would drift. Cargo permits the cycle because it only
# exists for test targets; the library itself still depends on nothing upward.
infero-model.workspace = true
tracing-subscriber.workspace = true
rand = "0.9"
cudarc = { version = "0.19", default-features = false, features = ["std", "driver", "nvrtc", "cublas", "f16", "dynamic-loading"] }

[features]
default = ["cuda-13"]
cuda = ["dep:infero-cuda", "dep:cudarc", "infero-gpu/cuda"]
cuda-13 = ["cuda", "infero-cuda/cuda-13", "cudarc/cuda-13010", "infero-gpu/cuda-13"]
cuda-12 = ["cuda", "infero-cuda/cuda-12", "cudarc/cuda-12080", "infero-gpu/cuda-12"]
metal = ["infero-gpu/metal"]
# AOT-compiles crates/kernels/src/cutlass/fp8_bw_gemm.cu with nvcc and links
# it in -- needs a full CUDA Toolkit (INFERO_NVCC) and an NVIDIA/cutlass
# checkout (INFERO_CUTLASS_DIR); see build.rs. Off by default: every other
# kernel needs neither.
cutlass = ["cuda"]

[[example]]
name = "cutlass_vs_block"
required-features = ["cutlass"]

[package]
name = "tuili-kernels"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
tuili-safetensors.workspace = true
tuili-cuda = { workspace = true, optional = true }
tuili-gpu.workspace = true
tuili-gguf.workspace = true
anyhow.workspace = true
half.workspace = true
tracing.workspace = true
cudarc = { version = "0.19", default-features = false, optional = true, features = ["std", "driver", "nvrtc", "cublas", "f16", "dynamic-loading"] }

[dev-dependencies]
# A dev-dependency on the crate above this one, so that the partial-rope kernel
# tests can check against `tuili_model::qwen35`'s host reference rather than a
# second copy of it that would drift. Cargo permits the cycle because it only
# exists for test targets; the library itself still depends on nothing upward.
tuili-model.workspace = true
tracing-subscriber.workspace = true
rand = "0.9"
cudarc = { version = "0.19", default-features = false, features = ["std", "driver", "nvrtc", "cublas", "f16", "dynamic-loading"] }

[features]
default = ["cuda-13"]
cuda = ["dep:tuili-cuda", "dep:cudarc", "tuili-gpu/cuda"]
cuda-13 = ["cuda", "tuili-cuda/cuda-13", "cudarc/cuda-13010", "tuili-gpu/cuda-13"]
cuda-12 = ["cuda", "tuili-cuda/cuda-12", "cudarc/cuda-12080", "tuili-gpu/cuda-12"]
metal = ["tuili-gpu/metal"]

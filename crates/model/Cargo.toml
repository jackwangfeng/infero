[package]
name = "infero-model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
infero-safetensors.workspace = true
infero-gguf.workspace = true
infero-cuda = { workspace = true, optional = true }
infero-gpu.workspace = true
anyhow.workspace = true
half.workspace = true
tracing.workspace = true
cudarc = { version = "0.19.9", default-features = false, optional = true, features = ["std", "driver", "nvrtc", "cublas", "f16", "dynamic-loading"] }
infero-kernels.workspace = true
rand = "0.9"
serde_json = "1"
# A video's frames resize independently of each other (`qwen35_vision_image
# ::prepare_clip`) -- real CPU-bound work with no shared state, exactly what
# rayon's work-stealing pool is for.
rayon = "1"

[dev-dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tracing-subscriber.workspace = true
infero-tokenizer.workspace = true

[features]
default = ["cuda-13"]
cuda = ["dep:infero-cuda", "dep:cudarc", "infero-kernels/cuda", "infero-gpu/cuda"]
cuda-13 = ["cuda", "infero-kernels/cuda-13", "infero-cuda/cuda-13", "cudarc/cuda-13010", "infero-gpu/cuda-13"]
cuda-12 = ["cuda", "infero-kernels/cuda-12", "infero-cuda/cuda-12", "cudarc/cuda-12080", "infero-gpu/cuda-12"]
metal = ["infero-kernels/metal", "infero-gpu/metal"]
cutlass = ["infero-kernels/cutlass"]
flash_attn2 = ["infero-kernels/flash_attn2"]
nccl = ["infero-kernels/nccl"]

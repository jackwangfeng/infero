[workspace]
resolver = "3"
members = [
    "crates/gguf",
    "crates/safetensors",
    "crates/cuda",
    "crates/gpu",
    "crates/metal",
    "crates/kernels",
    "crates/tokenizer",
    "crates/model",
    "crates/server",
    "crates/tui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"

[workspace.dependencies]
infero-gguf = { path = "crates/gguf" }
infero-safetensors = { path = "crates/safetensors" }
infero-cuda = { path = "crates/cuda", default-features = false }
infero-metal = { path = "crates/metal" }
infero-gpu = { path = "crates/gpu", default-features = false }
infero-kernels = { path = "crates/kernels", default-features = false }
infero-tokenizer = { path = "crates/tokenizer" }
infero-model = { path = "crates/model", default-features = false }

anyhow = "1"
thiserror = "2"
half = "2"
memmap2 = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = 1
